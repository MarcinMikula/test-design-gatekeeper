name: Windows age BVA input byte verification

on:
  push:
    branches:
      - verify/windows-bva-outcomes

permissions: {}

env:
  TDG_BVA_COMMIT: '562abc0be964100124e0d076bbd18312276dfb5e'

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Fetch the exact product commit
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git init
          git -c core.autocrlf=false fetch --depth=1 https://github.com/MarcinMikula/test-design-gatekeeper.git $env:TDG_BVA_COMMIT
          git -c core.autocrlf=false checkout --detach FETCH_HEAD
          $checkedCommit = git rev-parse HEAD
          if ($checkedCommit -ne $env:TDG_BVA_COMMIT) {
            throw "Unexpected product commit $checkedCommit"
          }
          Write-Output "Product commit $checkedCommit"
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.12.19
      - name: Sync the locked environment
        run: python -m uv sync --locked
      - name: Confirm native Windows x64 and the Python pin
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
          .\.venv\Scripts\python.exe -c "import platform; from pathlib import Path; from tdg.windows_workspace import supported_host; print(platform.platform(), platform.machine(), platform.python_version()); assert supported_host(); assert platform.python_version() == Path('.python-version').read_text().strip()"
      - name: Verify the draft README command in PowerShell
        run: |
          $output = cmd.exe /d /s /c '.venv\Scripts\tdg.exe lab-age-bva --classification synthetic --actor-ref lab-qa --basis-id BR-AGE-01 --confirmed-interval 18 120 --confirmed-result-texts "Registration is accepted." "Registration is rejected." < "tests\fixtures\i01\base-01.json"'
          if ($LASTEXITCODE -ne 0) { throw 'TDG command failed' }
          $result = ($output -join [Environment]::NewLine) | ConvertFrom-Json
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath 'tests\fixtures\i01\base-01.json').Hash.ToLowerInvariant()
          if ($digest -ne '630be02e0549a22f2371635a79c76bc3588af6fc953dfcf3e5a892e2bb87c7a1' -or $result.input_sha256 -ne $digest -or ($result.missing_ages -join ',') -ne '17,18,120,121' -or $result.case_age_inputs[0].expected_result_alignment.status -ne 'SUPPORTED') {
            throw 'The README example did not preserve the bytes and observations'
          }
          Write-Output "PowerShell $($PSVersionTable.PSVersion) BASE-01 SHA-256 matches $digest"
      - name: Verify a 64 KiB UTF-8 file in Windows PowerShell
        shell: powershell
        run: |
          $encoding = [Text.UTF8Encoding]::new($false)
          $source = [IO.File]::ReadAllText((Resolve-Path 'tests\fixtures\i01\base-01.json').Path, $encoding)
          $source = $source.Replace('Synthetic customer-registration system', "Syntetyczna rejestracja $([char]0x0142)$([char]0x00f3)$([char]0x017c)")
          $sample = Join-Path $env:RUNNER_TEMP 'tdg UTF-8 example.json'
          $padding = 65536 - $encoding.GetByteCount($source)
          [IO.File]::WriteAllText($sample, $source + (' ' * $padding), $encoding)
          $line = '.venv\Scripts\tdg.exe lab-age-bva --classification synthetic --actor-ref lab-qa --basis-id BR-AGE-01 --confirmed-interval 18 120 --confirmed-result-texts "Registration is accepted." "Registration is rejected." < "' + $sample + '"'
          $output = cmd.exe /d /s /c $line
          if ($LASTEXITCODE -ne 0) { throw 'TDG command failed for the UTF-8 sample' }
          $result = ($output -join [Environment]::NewLine) | ConvertFrom-Json
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $sample).Hash.ToLowerInvariant()
          if ((Get-Item -LiteralPath $sample).Length -ne 65536 -or $result.input_sha256 -ne $digest -or $result.outcome -ne 'ASSESSED' -or $result.case_age_inputs[0].expected_result_alignment.status -ne 'SUPPORTED') {
            throw 'The 64 KiB UTF-8 file did not reach TDG intact'
          }
          Write-Output "Windows PowerShell $($PSVersionTable.PSVersion) 65536-byte UTF-8 SHA-256 matches $digest"
