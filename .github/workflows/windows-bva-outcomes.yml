name: Windows age BVA outcome verification

on:
  push:
    branches:
      - verify/windows-bva-outcomes

permissions: {}

env:
  TDG_BVA_COMMIT: '2e0e41c8238af24a93f66081e6ab075fb0b51e3e'

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Fetch the exact product commit
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git init
          git -c core.autocrlf=false fetch --depth=1 https://github.com/MarcinMikula/test-design-gatekeeper.git $env:TDG_BVA_COMMIT
          git -c core.autocrlf=false checkout --detach FETCH_HEAD
          $checkedCommit = git rev-parse HEAD
          if ($checkedCommit -ne $env:TDG_BVA_COMMIT) {
            throw "Unexpected product commit $checkedCommit"
          }
          Write-Output "Product commit $checkedCommit"
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.12.19
      - name: Sync the locked environment
        run: python -m uv sync --locked
      - name: Confirm native Windows x64 and the Python pin
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
          .\.venv\Scripts\python.exe -c "import platform; from pathlib import Path; from tdg.windows_workspace import supported_host; print(platform.platform(), platform.machine(), platform.python_version()); assert supported_host(); assert platform.python_version() == Path('.python-version').read_text().strip()"
      - name: Run the product and Windows workspace tests
        run: .\.venv\Scripts\python.exe -m pytest -q -rs
      - name: Run the PowerShell example from README
        run: |
          $output = & {
            Get-Content -Raw -Encoding UTF8 tests\fixtures\i01\base-01.json |
                .\.venv\Scripts\tdg.exe lab-age-bva --classification synthetic --actor-ref lab-qa `
                    --basis-id BR-AGE-01 --confirmed-interval 18 120 `
                    --confirmed-result-texts 'Registration is accepted.' 'Registration is rejected.'
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = ($output -join [Environment]::NewLine) | ConvertFrom-Json
          $alignment = $result.case_age_inputs[0].expected_result_alignment
          if ($result.outcome -ne 'ASSESSED' -or ($result.missing_ages -join ',') -ne '17,18,120,121' -or $alignment.status -ne 'SUPPORTED' -or $alignment.declared_outcome -ne 'ACCEPTED' -or $alignment.locator -ne '/content/test_cases/0/steps/0/expected_result') {
            throw 'BASE-01 did not produce the expected coverage and expected-result observations'
          }
          $output
